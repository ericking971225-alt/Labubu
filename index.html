    let availableQuotes = [];

    function getUniqueQuote() {
      if (availableQuotes.length === 0) {
        availableQuotes = [...quotesPool];
        availableQuotes.sort(() => Math.random() - 0.5); 
      }
      return availableQuotes.pop();
    }

    // 3. 初始化與科目切換
    function init() {
      updateStreakDisplay();
      document.getElementById('wrong-count').innerText = wrongBook.length;
      // 預設選擇全科並載入題目
      selectSubject('全部', document.querySelector('.subject-btn.active'));
    }

    function selectSubject(sub, btnElement) {
      if (btnElement) {
        document.querySelectorAll('#view-quiz .subject-btn').forEach(btn => btn.classList.remove('active'));
        btnElement.classList.add('active');
      }

      currentSubject = sub;

      // 🌟 修正點：將 data.js 的資料過濾並載入到 filteredDB 裡面
      const sourceData = (typeof database !== 'undefined') ? database : (window.database || []);
      if (sub === '全部') {
        filteredDB = sourceData;
      } else {
        filteredDB = sourceData.filter(q => q.subject === sub);
      }

      loadQuestion();
    }

    // 4. 題目載入與回答邏輯
    function loadQuestion() {
      startTimer();
      renderMath();

      if (!filteredDB || filteredDB.length === 0) {
        document.getElementById('q-badge').innerText = `💡 提示`;
        document.getElementById('q-text').innerText = "此科目目前沒有題目！";
        document.getElementById('q-options').innerHTML = '';
        return;
      }

      const randIndex = Math.floor(Math.random() * filteredDB.length);
      currentQuestion = filteredDB[randIndex];

      document.getElementById('q-badge').innerText = `💡 ${currentQuestion.subject}`;
      document.getElementById('q-text').innerText = currentQuestion.question;
      
      const optionsContainer = document.getElementById('q-options');
      optionsContainer.innerHTML = '';
      
      for (const [key, val] of Object.entries(currentQuestion.options)) {
        const btn = document.createElement('button');
        btn.className = 'btn-option';
        btn.innerText = `${key}. ${val}`;
        btn.onclick = () => checkAnswer(btn, key);
        optionsContainer.appendChild(btn);
      }

      document.getElementById('q-explanation').classList.add('hidden');
      document.getElementById('btn-next').classList.add('hidden');
    }

    function checkAnswer(btn, selectedKey) {
      stopTimer();
      const options = document.querySelectorAll('.btn-option');
      options.forEach(opt => opt.onclick = null); // 鎖定作答

      const isCorrect = (selectedKey === currentQuestion.answer);

      if (isCorrect) {
        btn.classList.add('correct');
        currentStreak++;
        localStorage.setItem('winStreak', currentStreak);

        if (currentStreak > 0 && currentStreak % 5 === 0) {
          showRewardModal();
        }
      } else {
        btn.classList.add('wrong');
        options.forEach(opt => {
          if (opt.innerText.startsWith(currentQuestion.answer)) opt.classList.add('correct');
        });
        
        currentStreak = 0;
        localStorage.setItem('winStreak', currentStreak);
       addToWrongBook(currentQuestion, selectedKey);
      }

      updateStreakDisplay();
      const exp = document.getElementById('q-explanation');
      exp.innerHTML = `<strong>解析：</strong> ${currentQuestion.explanation}`;
      exp.classList.remove('hidden');
      document.getElementById('btn-next').classList.remove('hidden');
      renderMath();
    }
    function nextQuestion() {
      loadQuestion();
    }

    // 5. 連勝與數學渲染工具
    function updateStreakDisplay() {
      const streakElement = document.getElementById('streak-count'); 
      if (streakElement) {
        streakElement.innerText = `🔥 連勝: ${currentStreak}`;
      }
    }

    function renderMath() {
      setTimeout(() => {
        if (window.MathJax && window.MathJax.typesetPromise) {
          MathJax.typesetClear();
          MathJax.typesetPromise().catch((err) => console.log('MathJax error:', err));
        }
      }, 50);
    }

    function showRewardModal() {
      document.getElementById('reward-streak-num').innerText = currentStreak;
      document.getElementById('reward-msg').innerText = getUniqueQuote();
      document.getElementById('reward-modal').classList.remove('hidden');
    }

    function closeRewardModal() {
      document.getElementById('reward-modal').classList.add('hidden');
    }

    // 6. 計時器功能
    function startTimer() {
      stopTimer();
      secondsElapsed = 0;
      updateTimerDisplay();
      timerInterval = setInterval(() => {
        secondsElapsed++;
        updateTimerDisplay();
      }, 1000);
    }

    function stopTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    function updateTimerDisplay() {
      const timerElement = document.getElementById('timer-text');
      if (!timerElement) return;
      const minutes = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
      const seconds = (secondsElapsed % 60).toString().padStart(2, '0');
      timerElement.innerText = `${minutes}:${seconds}`;
    }

    // 7. 錯題本與自訂上傳
    function switchTab(tab) {
      document.getElementById('tab-quiz-btn').classList.remove('active');
      document.getElementById('tab-wrong-btn').classList.remove('active');
      document.getElementById('view-quiz').classList.add('hidden');
      document.getElementById('view-wrong').classList.add('hidden');

      if (tab === 'quiz') {
        document.getElementById('tab-quiz-btn').classList.add('active');
        document.getElementById('view-quiz').classList.remove('hidden');
      } else {
        document.getElementById('tab-wrong-btn').classList.add('active');
        document.getElementById('view-wrong').classList.remove('hidden');
        renderWrongBook();
      }
    }

    function filterWrong(sub, btnElement) {
      document.querySelectorAll('#wrong-subject-grid .subject-btn').forEach(btn => btn.classList.remove('active'));
      if (btnElement) btnElement.classList.add('active');
      wrongBookFilterSubject = sub;
      renderWrongBook();
    }

    function addToWrongBook(qObj, userAnswer) {
      const exists = wrongBook.find(w => w.question === qObj.question);
      if (!exists) {
        wrongBook.unshift({
          id: Date.now(),
          subject: qObj.subject,
          question: qObj.question,
          options: qObj.options || null,
          answer: qObj.answer || '',
          userAnswer: userAnswer || '',
          explanation: qObj.explanation,
          imgBase64: null
        });
        saveWrongBook();
      }
    }

function renderWrongBook() {
      renderMath();
      const container = document.getElementById('wrong-list-container');
      container.innerHTML = '';
      
      let filtered = wrongBook;
      if (wrongBookFilterSubject !== '全部') {
        filtered = wrongBook.filter(w => w.subject === wrongBookFilterSubject);
      }

      document.getElementById('wrong-count').innerText = wrongBook.length;

      if (filtered.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding: 40px; color: #64748b;">該科目目前沒有錯題 🎉</div>`;
        return;
      }

      filtered.forEach(item => {
        let optionsHTML = '';
        if (item.options) {
          optionsHTML = `<div style="margin: 12px 0; padding: 12px; background: #f8fafc; border-radius: 12px; border: 1px solid #e2e8f0;">`;
          for (const [key, val] of Object.entries(item.options)) {
            const isCorrect = (key === item.answer);
            const isUserWrong = (key === item.userAnswer); // 🌟 判斷這是不是使用者當時選錯的
            
            let style = `color: #475569; font-weight: 500; padding: 4px 8px; display: inline-block; margin-bottom: 6px;`; // 預設一般選項樣式
            let icon = '';

            if (isCorrect) {
              // 正確答案：綠色底 + 勾勾
              style = `color: #059669; font-weight: 800; background: #d1fae5; padding: 4px 8px; border-radius: 6px; display: inline-block; margin-bottom: 6px; border: 1px solid #10b981;`;
              icon = ' ';
            } else if (isUserWrong) {
              // 使用者選錯的：紅色底 + 刪除線 + 叉叉
              style = `color: #dc2626; font-weight: 800; background: #fee2e2; padding: 4px 8px; border-radius: 6px; display: inline-block; margin-bottom: 6px; border: 1px solid #ef4444; text-decoration: line-through;`;
              icon = '  (你的作答)';
            }
            
            optionsHTML += `<div style="${style}">${key}. ${val}${icon}</div><br>`;
          }
          optionsHTML += `</div>`;
        }

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <button class="btn-delete" onclick="deleteWrong(${item.id})">刪除</button>
          <div class="subject-badge">💡 ${item.subject}</div>
          <div class="question-text">${item.question || '(圖片題)'}</div>
          
          ${optionsHTML}
          
          ${item.imgBase64 ? `<img src="${item.imgBase64}" class="wrong-img" alt="題目圖片">` : ''}
          <div class="explanation" style="margin-top: 15px;">
            <strong>解析/筆記：</strong> ${item.explanation}
          </div>
        `;
        container.appendChild(card);
      });
    }
    function deleteWrong(id) {
      if (confirm('確定要刪除這筆錯題嗎？')) {
        wrongBook = wrongBook.filter(w => w.id !== id);
        saveWrongBook();
        renderWrongBook();
      }
    }

    function saveWrongBook() {
      localStorage.setItem('labu_wrong_book', JSON.stringify(wrongBook));
      document.getElementById('wrong-count').innerText = wrongBook.length;
    }

    function openAddModal() {
      document.getElementById('custom-question').value = '';
      document.getElementById('custom-explanation').value = '';
      document.getElementById('custom-image').value = '';
      document.getElementById('image-preview').src = '';
      document.getElementById('image-preview').classList.add('hidden');
      currentImageBase64 = null;
      document.getElementById('add-modal').classList.remove('hidden');
    }

    function closeAddModal() {
      document.getElementById('add-modal').classList.add('hidden');
    }

    function previewImage(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          currentImageBase64 = e.target.result;
          const preview = document.getElementById('image-preview');
          preview.src = currentImageBase64;
          preview.classList.remove('hidden');
        };
        reader.readAsDataURL(file);
      }
    }

    function saveCustomWrong() {
      const subj = document.getElementById('custom-subject').value;
      const q = document.getElementById('custom-question').value.trim();
      const exp = document.getElementById('custom-explanation').value.trim();

      if (!q && !currentImageBase64) {
        alert("請至少輸入題目文字或上傳題目圖片！");
        return;
      }
      if (!exp) {
        alert("請輸入解析或正確答案！");
        return;
      }

      wrongBook.unshift({
        id: Date.now(),
        subject: subj,
        question: q,
        answer: '',
        explanation: exp,
        imgBase64: currentImageBase64
      });

      saveWrongBook();
      closeAddModal();
      alert("錯題已成功儲存！");
    }

    // 8. 啟動應用程式
    window.onload = init;
  </script>
