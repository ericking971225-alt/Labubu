      document.querySelectorAll('.subject-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentSubject = subject;
      filterQuestions();
      nextQuestion();
    }
    // 過濾科目題目
    function filterQuestions() {
      if (currentSubject === '全部') {
        filteredQuestions = [...database];
      } else {
        filteredQuestions = database.filter(q => q.subject === currentSubject);
      }
    }
   / 抽題與渲染
    function nextQuestion() {
      if (filteredQuestions.length === 0) return;
      
      const randomIndex = Math.floor(Math.random() * filteredQuestions.length);
      currentQuestion = filteredQuestions[randomIndex];

      document.getElementById('q-badge').innerText = `💡 ${currentQuestion.subject}`;
      document.getElementById('q-text').innerText = currentQuestion.question;
      
      const optionsContainer = document.getElementById('q-options');
      optionsContainer.innerHTML = '';
      
      Object.entries(currentQuestion.options).forEach(([key, optText]) => {
        const btn = document.createElement('button');
        btn.className = 'btn-option';
        btn.innerText = `${key}. ${optText}`;
        btn.onclick = () => checkAnswer(key, btn);
        optionsContainer.appendChild(btn);
      });

      document.getElementById('q-explanation').classList.add('hidden');
      document.getElementById('btn-next').classList.add('hidden');
    }
      // 隨機打亂題目
      filteredQuestions.sort(() => Math.random() - 0.5);
    }

    // 載入題目
    function loadQuestion() {
      answered = false;
      const q = filteredQuestions[currentQIndex];
      if (!q) return;

      document.getElementById('q-badge').innerText = q.subject;
      document.getElementById('q-text').innerText = `${currentQIndex + 1}. ${q.question}`;
      
      const optionsContainer = document.getElementById('q-options');
      optionsContainer.innerHTML = '';

      for (let key in q.options) {
        const btn = document.createElement('button');
        btn.className = 'btn-option';
        btn.innerText = `${key}. ${q.options[key]}`;
        btn.onclick = () => checkAnswer(key, q);
        optionsContainer.appendChild(btn);
      }

      document.getElementById('q-explanation').classList.add('hidden');
      document.getElementById('btn-next').classList.add('hidden');
    }

    // 檢查答案
    function checkAnswer(selectedOption, question) {
      if (answered) return;
      answered = true;

      const isCorrect = (selectedOption === question.answer);
      const optionBtns = document.querySelectorAll('.btn-option');

      optionBtns.forEach(btn => {
        const optKey = btn.innerText.charAt(0);
        if (optKey === question.answer) {
          btn.classList.add('correct');
        } else if (optKey === selectedOption && !isCorrect) {
          btn.classList.add('wrong');
        }
      });

      // 處理連勝與錯題紀錄
      if (isCorrect) {
        streak++;
        if (streak % 5 === 0) showRewardModal(streak);
      } else {
        streak = 0;
        addWrongQuestion(question);
      }

      document.getElementById('streak-count').innerText = `🔥 連勝: ${streak}`;
      
      // 顯示解析與下一題按鈕
      const expDiv = document.getElementById('q-explanation');
      expDiv.innerHTML = `<strong>解析：</strong> ${question.explanation}`;
      expDiv.classList.remove('hidden');
      document.getElementById('btn-next').classList.remove('hidden');
    }

    // 下一題
    function nextQuestion() {
      currentQIndex = (currentQIndex + 1) % filteredQuestions.length;
      loadQuestion();
    }

    // 加入錯題本
    function addWrongQuestion(q) {
      if (!wrongList.some(item => item.question === q.question)) {
        wrongList.push({
          subject: q.subject,
          question: q.question,
          explanation: `正確答案：${q.answer} | ${q.explanation}`
        });
        saveWrongList();
      }
    }

        return;
      }

      container.innerHTML = '';
      wrongList.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <button class="btn-delete" onclick="deleteWrong(${index})">🗑️ 移除</button>
          <div class="subject-badge">${item.subject}</div>
          <div class="question-text">${item.question}</div>
          <div class="explanation">${item.explanation}</div>
        `;
        container.appendChild(card);
      });
    }

    function deleteWrong(index) {
      wrongList.splice(index, 1);
      saveWrongList();
      renderWrongList();
    }

    function saveWrongList() {
      localStorage.setItem('labu_wrong_list', JSON.stringify(wrongList));
      updateWrongCount();
    }

    function updateWrongCount() {
      document.getElementById('wrong-count').innerText = wrongList.length;
    }

    // 彈窗操作
    function openAddModal() { document.getElementById('add-modal').classList.remove('hidden'); }
    function closeAddModal() { document.getElementById('add-modal').classList.add('hidden'); }

    function saveCustomWrong() {
      const subject = document.getElementById('custom-subject').value;
      const question = document.getElementById('custom-question').value.trim();
      const explanation = document.getElementById('custom-explanation').value.trim();

      if (!question || !explanation) {
        alert('請填寫完整內容！');
        return;
      }

      wrongList.unshift({ subject, question, explanation });
      saveWrongList();
      closeAddModal();
      document.getElementById('custom-question').value = '';
      document.getElementById('custom-explanation').value = '';
      renderWrongList();
    }
