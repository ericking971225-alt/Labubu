<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>學測自然 AI 刷題大師</title>
  <style>
    :root {
      --primary: #6366f1;
      --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      --bg-gradient: linear-gradient(180deg, #f0fdf4 0%, #e0f2fe 50%, #f3e8ff 100%);
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(255, 255, 255, 0.6);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --correct: #10b981;
      --correct-bg: #d1fae5;
      --wrong: #ef4444;
      --wrong-bg: #fee2e2;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg-gradient); color: var(--text-main); min-height: 100vh; padding-bottom: 90px; }
    header { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(16px); padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(226, 232, 240, 0.8); position: sticky; top: 0; z-index: 20; }
    .app-title { font-size: 1.15rem; font-weight: 800; background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .streak-badge { background: #fef3c7; color: #b45309; padding: 4px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: 700; }
    .container { max-width: 500px; margin: 0 auto; padding: 16px; }
    .card { background: var(--card-bg); backdrop-filter: blur(12px); padding: 24px; border-radius: 24px; border: 1px solid var(--card-border); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); margin-bottom: 20px; }
    .subject-badge { display: inline-flex; align-items: center; padding: 6px 14px; border-radius: 30px; font-size: 0.85rem; font-weight: 800; color: white; margin-bottom: 14px; background: var(--primary); }
    .question-text { font-size: 1.1rem; line-height: 1.65; font-weight: 600; margin-bottom: 20px; }
    .options { display: flex; flex-direction: column; gap: 12px; }
    .btn-option { background: white; border: 2px solid #e2e8f0; padding: 14px 18px; border-radius: 16px; text-align: left; font-size: 1rem; font-weight: 500; cursor: pointer; }
    .btn-option.correct { background: var(--correct-bg); border-color: var(--correct); color: #065f46; font-weight: 700; }
    .btn-option.wrong { background: var(--wrong-bg); border-color: var(--wrong); color: #991b1b; font-weight: 700; }
    .explanation { margin-top: 20px; padding: 16px; background: rgba(241, 245, 249, 0.9); border-left: 4px solid var(--primary); border-radius: 12px; font-size: 0.95rem; line-height: 1.6; }
    .btn-action { width: 100%; background: var(--primary-gradient); color: white; border: none; padding: 16px; border-radius: 16px; font-size: 1.05rem; font-weight: 700; cursor: pointer; margin-top: 16px; }
    .loader-box { text-align: center; padding: 40px 20px; }
    .spinner { width: 48px; height: 48px; border: 5px solid rgba(99, 102, 241, 0.2); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s infinite linear; margin: 0 auto 16px auto; }
    input[type="text"] { width: 100%; padding: 14px; border: 2px solid #e2e8f0; border-radius: 12px; margin-top: 10px; font-size: 1rem; }
    .hidden { display: none !important; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <header>
    <div class="app-title">🚀 學測自然 AI 大師</div>
    <div class="streak-badge" id="streak-count">🔥 連勝: 0</div>
  </header>

  <div class="container">
    <div id="loading" class="card loader-box hidden">
      <div class="spinner"></div>
      <p style="font-weight: 700; color: var(--primary);">AI 出題中...</p>
    </div>

    <div id="quiz-card" class="card hidden">
      <div id="q-badge" class="subject-badge">💡 自然科</div>
      <div class="question-text" id="q-text"></div>
      <div class="options" id="q-options"></div>
      <div id="q-explanation" class="explanation hidden"></div>
      <button id="btn-next" class="btn-action hidden" onclick="fetchQuestion()">下一題 ➔</button>
    </div>

    <div id="api-setting" class="card">
      <h3 style="font-size: 1.1rem; margin-bottom: 6px;">🔑 API Key 設定</h3>
      <p style="font-size: 0.85rem; color: var(--text-muted);">請貼上 OpenRouter Key (sk-or-...)</p>
      <input type="text" id="api-key-input" placeholder="貼上 OpenRouter API Key">
      <button class="btn-action" onclick="saveApiKey()">儲存並開始刷題</button>
    </div>
  </div>

  <script>
    let apiKey = localStorage.getItem('app_api_key') || '';
    let currentQuestion = null;
    let streak = 0;

    window.onload = () => {
      if (apiKey) {
        document.getElementById('api-key-input').value = apiKey;
        document.getElementById('api-setting').classList.add('hidden');
        fetchQuestion();
      }
    };

    function saveApiKey() {
      const key = document.getElementById('api-key-input').value.trim();
      if (key) {
        localStorage.setItem('app_api_key', key);
        apiKey = key;
        document.getElementById('api-setting').classList.add('hidden');
        fetchQuestion();
      }
    }

    async function fetchQuestion() {
      document.getElementById('loading').classList.remove('hidden');
      document.getElementById('quiz-card').classList.add('hidden');
      document.getElementById('q-explanation').classList.add('hidden');
      document.getElementById('btn-next').classList.add('hidden');

      const prompt = `你是一個台灣 108 課綱學測自然科命題專家。請出一題符合學測難度的單選題（隨機挑選：物理、化學、生物、地科）。請嚴格遵守回傳純 JSON 格式如下，不要加上任何 markdown 標記：
      {
        "subject": "物理", 
        "question": "題目描述",
        "options": {"A": "選項A", "B": "選項B", "C": "選項C", "D": "選項D"},
        "answer": "A",
        "explanation": "詳細觀念解析"
      }`;

      // OpenRouter 高可用免費模型清單
      const freeModels = [
        'google/gemini-2.0-flash-exp:free',
        'google/gemini-2.0-flash-lite-preview:free',
        'google/gemini-1.5-flash:free',
        'meta-llama/llama-3.3-70b-instruct:free'
      ];

      let success = false;
      let lastError = '';

      for (const model of freeModels) {
        try {
          const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${apiKey}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              model: model,
              messages: [{ role: 'user', content: prompt }]
            })
          });

          const data = await res.json();
          if (!res.ok) throw new Error(data.error?.message || '模型響應失敗');

          let textResult = data.choices[0].message.content;
          textResult = textResult.replace(/```json/gi, '').replace(/```/g, '').trim();
          currentQuestion = JSON.parse(textResult);

          displayQuestion(currentQuestion);
          success = true;
          break; // 成功出題立刻跳出
        } catch (err) {
          console.warn(`模型 ${model} 暫無法使用，自動嘗試下一個...`, err.message);
          lastError = err.message;
        }
      }

      document.getElementById('loading').classList.add('hidden');

      if (success) {
        document.getElementById('quiz-card').classList.remove('hidden');
      } else {
        alert('出題失敗：' + lastError + '\n請檢查 OpenRouter API Key 是否複製完整！');
        document.getElementById('api-setting').classList.remove('hidden');
      }
    }

    function displayQuestion(q) {
      document.getElementById('q-badge').innerText = '💡 ' + q.subject;
      document.getElementById('q-text').innerText = q.question;
      const optionsContainer = document.getElementById('q-options');
      optionsContainer.innerHTML = '';

      Object.keys(q.options).forEach(key => {
        const btn = document.createElement('button');
        btn.className = 'btn-option';
        btn.innerHTML = `<b>${key}.</b> ${q.options[key]}`;
        btn.onclick = () => checkAnswer(key, btn);
        optionsContainer.appendChild(btn);
      });
    }

    function checkAnswer(selected, selectedBtn) {
      const allBtns = document.querySelectorAll('.btn-option');
      allBtns.forEach(btn => btn.onclick = null);

      if (selected === currentQuestion.answer) {
        selectedBtn.classList.add('correct');
        streak++;
      } else {
        selectedBtn.classList.add('wrong');
        streak = 0;
        allBtns.forEach(btn => {
          if (btn.innerText.startsWith(currentQuestion.answer)) btn.classList.add('correct');
        });
      }

      document.getElementById('streak-count').innerText = `🔥 連勝: ${streak}`;
      const expBox = document.getElementById('q-explanation');
      expBox.innerHTML = `<strong>💡 解析：</strong><br>${currentQuestion.explanation}`;
      expBox.classList.remove('hidden');
      document.getElementById('btn-next').classList.remove('hidden');
    }
  </script>
</body>
</html>
