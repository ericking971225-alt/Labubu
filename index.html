<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="學測自然刷題">
  <title>學測自然 AI 刷題本</title>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --border: #e2e8f0;
      --correct: #16a34a;
      --wrong: #dc2626;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 70px; }
    header { background: var(--card); padding: 16px; text-align: center; font-weight: bold; font-size: 1.2rem; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
    .container { max-width: 600px; margin: 0 auto; padding: 16px; }
    .card { background: var(--card); padding: 20px; border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 16px; }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; background: #e0e7ff; color: #4338ca; margin-bottom: 12px; }
    .question-text { font-size: 1.05rem; line-height: 1.6; margin-bottom: 16px; font-weight: 500; }
    .options { display: flex; flex-direction: column; gap: 10px; }
    .btn-option { background: var(--bg); border: 1px solid var(--border); padding: 12px 16px; border-radius: 10px; text-align: left; font-size: 1rem; cursor: pointer; transition: all 0.2s; color: var(--text); }
    .btn-option:active { background: #e2e8f0; }
    .btn-option.correct { background: #dcfce7; border-color: var(--correct); color: #14532d; font-weight: bold; }
    .btn-option.wrong { background: #fee2e2; border-color: var(--wrong); color: #7f1d1d; font-weight: bold; }
    .explanation { margin-top: 16px; padding: 12px; background: #f1f5f9; border-radius: 8px; font-size: 0.95rem; line-height: 1.5; color: #334155; }
    .btn-primary { width: 100%; background: var(--primary); color: white; border: none; padding: 14px; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 12px; }
    .nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); display: flex; border-top: 1px solid var(--border); }
    .nav-item { flex: 1; text-align: center; padding: 12px 0; font-size: 0.85rem; color: #64748b; cursor: pointer; }
    .nav-item.active { color: var(--primary); font-weight: bold; }
    .hidden { display: none; }
    input[type="text"] { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; margin-top: 8px; font-size: 1rem; }
  </style>
</head>
<body>

  <header id="header-title">學測自然 AI 刷題</header>

  <div class="container">
    <!-- 1. 刷題分頁 -->
    <div id="tab-quiz">
      <div id="loading" class="card hidden" style="text-align: center; color: #64748b;">
        AI 正在為你生成最新學測題目...
      </div>

      <div id="quiz-card" class="card hidden">
        <span class="badge" id="q-subject">科目</span>
        <div class="question-text" id="q-text">題目載入中...</div>
        <div class="options" id="q-options"></div>
        <div id="q-explanation" class="explanation hidden"></div>
        <button id="btn-next" class="btn-primary hidden" onclick="fetchQuestion()">下一題</button>
      </div>

      <div id="api-warning" class="card">
        <h3>👋 歡迎使用學測自然刷題 App</h3>
        <p style="margin-top: 8px; color: #64748b; font-size: 0.9rem;">請點擊下方「設定」頁面，貼上你的 API Key（AQ. 開頭也可以）即可開始刷題！</p>
      </div>
    </div>

    <!-- 2. 錯題本分頁 -->
    <div id="tab-mistakes" class="hidden">
      <div id="mistakes-list"></div>
    </div>

    <!-- 3. 設定分頁 -->
    <div id="tab-settings" class="hidden">
      <div class="card">
        <h3>API Key 設定</h3>
        <p style="font-size: 0.85rem; color: #64748b; margin-top: 4px;">貼上從 Google AI Studio 申請的金鑰：</p>
        <input type="text" id="api-key-input" placeholder="貼上 API Key">
        <button class="btn-primary" onclick="saveApiKey()">儲存設定</button>
      </div>
    </div>
  </div>

  <!-- 底部導覽列 -->
  <div class="nav">
    <div class="nav-item active" onclick="switchTab('quiz')">📝 每日刷題</div>
    <div class="nav-item" onclick="switchTab('mistakes')">📚 錯題本 (<span id="mistake-count">0</span>)</div>
    <div class="nav-item" onclick="switchTab('settings')">⚙️ 設定</div>
  </div>

  <script>
    let apiKey = localStorage.getItem('gemini_api_key') || '';
    let currentQuestion = null;
    let mistakes = JSON.parse(localStorage.getItem('mistakes_db') || '[]');

    window.onload = () => {
      updateMistakeCount();
      if (apiKey) {
        document.getElementById('api-key-input').value = apiKey;
        document.getElementById('api-warning').classList.add('hidden');
        fetchQuestion();
      }
    };

    function saveApiKey() {
      const key = document.getElementById('api-key-input').value.trim();
      if (key) {
        localStorage.setItem('gemini_api_key', key);
        apiKey = key;
        alert('儲存成功！可以開始刷題囉。');
        document.getElementById('api-warning').classList.add('hidden');
        switchTab('quiz');
        fetchQuestion();
      }
    }

    function switchTab(tabName) {
      document.querySelectorAll('.nav-item').forEach((item, idx) => {
        item.classList.toggle('active', (tabName === 'quiz' && idx === 0) || (tabName === 'mistakes' && idx === 1) || (tabName === 'settings' && idx === 2));
      });
      document.getElementById('tab-quiz').classList.toggle('hidden', tabName !== 'quiz');
      document.getElementById('tab-mistakes').classList.toggle('hidden', tabName !== 'mistakes');
      document.getElementById('tab-settings').classList.toggle('hidden', tabName !== 'settings');

      if (tabName === 'mistakes') renderMistakes();
    }

    async function fetchQuestion() {
      if (!apiKey) return;
      
      document.getElementById('loading').classList.remove('hidden');
      document.getElementById('quiz-card').classList.add('hidden');
      document.getElementById('q-explanation').classList.add('hidden');
      document.getElementById('btn-next').classList.add('hidden');

      const prompt = `你是一個台灣 108 課綱學測自然科命題專家。請出一題符合學測難度的單選題（隨機挑選：物理、化學、生物、地科）。請嚴格遵守回傳 JSON 格式如下，不要加上任何其餘文字：
      {
        "subject": "科目名稱",
        "question": "題目內文",
        "options": {"A": "選項A", "B": "選項B", "C": "選項C", "D": "選項D"},
        "answer": "A",
        "explanation": "觀念詳細解析"
      }`;

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }],
            generationConfig: { response_mime_type: "application/json" }
          })
        });

        if (!res.ok) {
          const errorData = await res.json();
          throw new Error(errorData.error?.message || 'API 請求失敗');
        }

        const data = await res.json();
        let textResult = data.candidates[0].content.parts[0].text;
        
        // 自動過濾掉可能的 markdown 標籤
        textResult = textResult.replace(/```json/g, '').replace(/```/g, '').trim();
        currentQuestion = JSON.parse(textResult);

        displayQuestion(currentQuestion);
      } catch (err) {
        console.error(err);
        alert('出題失敗：' + err.message + '\n請重新整理頁面或檢查 API Key。');
      } finally {
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('quiz-card').classList.remove('hidden');
      }
    }

    function displayQuestion(q) {
      document.getElementById('q-subject').innerText = q.subject;
      document.getElementById('q-text').innerText = q.question;
      
      const optionsContainer = document.getElementById('q-options');
      optionsContainer.innerHTML = '';

      Object.keys(q.options).forEach(key => {
        const btn = document.createElement('button');
        btn.className = 'btn-option';
        btn.innerText = `${key}. ${q.options[key]}`;
        btn.onclick = () => checkAnswer(key, btn);
        optionsContainer.appendChild(btn);
      });
    }

    function checkAnswer(selected, selectedBtn) {
      const allBtns = document.querySelectorAll('.btn-option');
      allBtns.forEach(btn => btn.onclick = null);

      const isCorrect = selected === currentQuestion.answer;
      
      if (isCorrect) {
        selectedBtn.classList.add('correct');
      } else {
        selectedBtn.classList.add('wrong');
        mistakes.push({ ...currentQuestion, date: new Date().toLocaleDateString() });
        localStorage.setItem('mistakes_db', JSON.stringify(mistakes));
        updateMistakeCount();

        allBtns.forEach(btn => {
          if (btn.innerText.startsWith(currentQuestion.answer)) {
            btn.classList.add('correct');
          }
        });
      }

      const expBox = document.getElementById('q-explanation');
      expBox.innerHTML = `<strong>解析：</strong><br>${currentQuestion.explanation}`;
      expBox.classList.remove('hidden');
      document.getElementById('btn-next').classList.remove('hidden');
    }

    function updateMistakeCount() {
      document.getElementById('mistake-count').innerText = mistakes.length;
    }

    function renderMistakes() {
      const container = document.getElementById('mistakes-list');
      if (mistakes.length === 0) {
        container.innerHTML = `<div class="card" style="text-align:center; color:#64748b;">尚無錯題紀錄，繼續保持！</div>`;
        return;
      }

      container.innerHTML = mistakes.map((item, index) => `
        <div class="card">
          <span class="badge">${item.subject} (${item.date})</span>
          <div class="question-text">${item.question}</div>
          <div style="font-size:0.9rem; color:var(--correct); font-weight:bold; margin-bottom:8px;">正確答案：${item.answer}. ${item.options[item.answer]}</div>
          <div class="explanation"><strong>觀念解析：</strong><br>${item.explanation}</div>
          <button class="btn-primary" style="background:#ef4444; margin-top:8px;" onclick="removeMistake(${index})">這題學會了（移出錯題本）</button>
        </div>
      `).join('');
    }

    function removeMistake(index) {
      mistakes.splice(index, 1);
      localStorage.setItem('mistakes_db', JSON.stringify(mistakes));
      updateMistakeCount();
      renderMistakes();
    }
  </script>
</body>
</html>
